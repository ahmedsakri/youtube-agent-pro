name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r openai/requirements-dev.txt
      - run: python scripts/validate_repo.py
      - run: python openai/scripts/validate.py
      - run: python -m compileall -q skills scripts openai/skills openai/scripts openai/tests
      - run: python -m unittest discover -s openai/tests -v
      - run: python openai/scripts/build_release.py
      - run: git diff --check && git diff --exit-code
