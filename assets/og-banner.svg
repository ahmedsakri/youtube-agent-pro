<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="YouTube Agent Pro - 24 skills, 5 agents, 11 tools for Claude Code, ChatGPT and OpenAI Codex">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0033"/>
      <stop offset="1" stop-color="#ff5277"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>

  <!-- Play glyph -->
  <g transform="translate(96,96)">
    <rect width="128" height="128" rx="28" fill="url(#accent)"/>
    <path d="M50 38 L50 90 L94 64 Z" fill="#ffffff"/>
  </g>

  <text x="256" y="150" font-size="68" font-weight="800" fill="#ffffff">YouTube Agent Pro</text>
  <text x="258" y="208" font-size="30" font-weight="500" fill="#c9d1d9">Skills &amp; subagents for YouTube creators &#8212; in Claude Code, ChatGPT &amp; OpenAI Codex</text>

  <!-- Stat chips -->
  <g transform="translate(96,300)">
    <rect width="352" height="150" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="176" y="78" font-size="60" font-weight="800" fill="#ff5277" text-anchor="middle">24</text>
    <text x="176" y="118" font-size="26" font-weight="600" fill="#c9d1d9" text-anchor="middle">Creator skills</text>
  </g>
  <g transform="translate(464,300)">
    <rect width="352" height="150" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="176" y="78" font-size="60" font-weight="800" fill="#ff5277" text-anchor="middle">5</text>
    <text x="176" y="118" font-size="26" font-weight="600" fill="#c9d1d9" text-anchor="middle">Specialist agents</text>
  </g>
  <g transform="translate(832,300)">
    <rect width="352" height="150" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="176" y="78" font-size="60" font-weight="800" fill="#ff5277" text-anchor="middle">11</text>
    <text x="176" y="118" font-size="26" font-weight="600" fill="#c9d1d9" text-anchor="middle">Local Python tools</text>
  </g>

  <!-- Footer row -->
  <text x="96" y="520" font-size="26" font-weight="600" fill="#8b949e">Scripts &#183; Shorts &#183; Titles &#183; Thumbnails &#183; SEO &#183; Analytics</text>
  <text x="96" y="566" font-size="24" font-weight="500" fill="#6e7681">MIT licensed &#183; no API key &#183; no uploader &#183; your data stays local</text>
